# Warp Launch Configuration
#
# Opinionated starter layout for working on this repo and related dev projects.
---
name: Dev Env Bootstrap
active_window_index: 0
windows:
  - active_tab_index: 0
    tabs:
      - title: dev-env-export
        layout:
          cwd: /Users/carlo/dev/dev-env-export
          split_direction: vertical
          panes:
            - cwd: /Users/carlo/dev/dev-env-export
              is_focused: true
              commands:
                - exec: clear
                - exec: git status --short
            - cwd: /Users/carlo/dev/dev-env-export
        color: blue
      - title: dev
        layout:
          cwd: /Users/carlo/dev
        color: cyan
