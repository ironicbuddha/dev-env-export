source: manual-catalogue

# This is a catalogue, not bootstrap input. No MCP server is installed or
# configured by default; prefer a CLI or Skill Hub skill when it provides the
# same capability.
optional_servers:
  - name: github
    notes: Consider only when a project needs an MCP-only GitHub integration.
  - name: playwright
    notes: Prefer project-owned browser automation before a machine MCP setup.
  - name: figma
    notes: Consider for active design-context work with an approved account.
